<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bounce Reborn</title>
    <meta
      name="description"
      content="Roll, bounce and spring through 30 changing worlds."
    />
    <meta name="theme-color" content="#10162b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bounce" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="update-banner hid" id="update-banner" role="status">
      <span>A new version is ready.</span>
      <button class="btn" id="update-now">Reload</button>
    </div>
    <div class="ctl hid" id="ctl">
      <button class="ib" id="pb" aria-label="Pause">❚❚</button
      ><button class="ib" id="mb" aria-label="Mute sound">♪</button
      ><button class="ib" id="sg" aria-label="Open settings">⚙</button>
    </div>
    <div class="hid" id="js" aria-label="Movement joystick">
      <div id="jk"></div>
    </div>
    <button class="tb hid" id="tj" aria-label="Jump">
      <svg
        viewBox="0 0 24 24"
        width="44"
        height="44"
        fill="none"
        stroke="#fff"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 14l7-7 7 7" />
        <path d="M5 21l7-7 7 7" opacity=".55" />
      </svg>
    </button>

    <div class="modal" id="stm">
      <div class="panel">
        <h1>Bounce Reborn</h1>
        <!-- <p class="byline">BY NIC TECH</p> -->
        <p>
          Roll, bounce and spring through 30 changing worlds. Collect every ring
          to open the portal.
        </p>
        <!-- <p>Move: arrows or A/D · Jump: Space or W · Pause: P</p> -->
        <div class="row">
          <button class="btn" id="play">Play</button>
          <button class="btn alt" id="levels">Levels</button>
          <button class="btn alt" id="daily">Daily challenge</button>
          <button class="btn alt" id="menu-settings">Settings</button>
          <!-- Ball skins are temporarily disabled.
          <button class="btn alt" id="open-skins">Ball skins</button> -->
          <button class="btn alt hid" id="inst">Install app</button>
        </div>
      </div>
    </div>
    <div class="modal hid" id="lvm">
      <div class="panel">
        <h2>Choose a level</h2>
        <div id="lvs"></div>
        <button class="btn alt" id="back">Back</button>
      </div>
    </div>
    <!-- Ball skins are temporarily disabled.
    <div class="modal hid" id="skinm">
      <div class="panel">
        <h2>Ball skins</h2>
        <p id="star-total"></p>
        <div class="skin-list" id="skins"></div>
        <button class="btn alt" id="skin-back">Back</button>
      </div>
    </div>
    -->
    <div class="modal hid" id="psm">
      <div class="panel">
        <h2>Paused</h2>
        <div class="row">
          <button class="btn" id="rs">Resume</button
          ><button class="btn alt" id="pause-settings">Settings</button
          ><button class="btn alt" id="mn">Menu</button>
        </div>
      </div>
    </div>
    <div class="modal hid" id="stgm">
      <div class="panel settings-panel">
        <h2>Settings</h2>
        <div class="volume-setting">
          <label for="music-volume">Background music</label>
          <div class="volume-row">
            <input
              id="music-volume"
              type="range"
              min="0"
              max="100"
              step="1"
              value="70"
            />
            <output id="music-volume-value" for="music-volume">70%</output>
          </div>
        </div>
        <div class="volume-setting">
          <label for="effects-volume">Sound effects</label>
          <div class="volume-row">
            <input
              id="effects-volume"
              type="range"
              min="0"
              max="100"
              step="1"
              value="100"
            />
            <output id="effects-volume-value" for="effects-volume">100%</output>
          </div>
        </div>
        <button class="btn alt" id="settings-back">Back</button>
      </div>
    </div>
    <div class="modal hid" id="wnm">
      <div class="panel">
        <h2 id="wt">Level clear!</h2>
        <div class="stars" id="st"></div>
        <p id="ws"></p>
        <div class="row">
          <button class="btn" id="nx">Next level</button
          ><button class="btn alt" id="rp">Replay</button>
        </div>
      </div>
    </div>
    <div class="modal hid" id="ovm">
      <div class="panel">
        <h2>Out of lives</h2>
        <p id="os"></p>
        <div class="row">
          <button class="btn" id="rt">Try again</button
          ><button class="btn alt" id="mn2">Menu</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
    <script src="update.js?v=2"></script>
  </body>
</html>
