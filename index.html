<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bounce Reborn</title>
    <meta
      name="description"
      content="Roll, bounce and spring through six changing worlds."
    />
    <meta name="theme-color" content="#10162b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bounce" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="ctl hid" id="ctl">
      <button class="ib" id="pb" aria-label="Pause">❚❚</button
      ><button class="ib" id="mb" aria-label="Mute sound">♪</button>
    </div>
    <div class="hid" id="js" aria-label="Movement joystick">
      <div id="jk"></div>
    </div>
    <button class="tb hid" id="tj" aria-label="Jump">
      <svg
        viewBox="0 0 24 24"
        width="44"
        height="44"
        fill="none"
        stroke="#fff"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 14l7-7 7 7" />
        <path d="M5 21l7-7 7 7" opacity=".55" />
      </svg>
    </button>

    <div class="modal" id="stm">
      <div class="panel">
        <h1>Bounce Reborn</h1>
        <p>
          Roll, bounce and spring through six changing worlds. Collect every
          ring to open the portal.
        </p>
        <p>Move: arrows or A/D · Jump: Space or W · Pause: P</p>
        <div class="row">
          <button class="btn" id="play">Play</button
          ><button class="btn alt" id="levels">Levels</button
          ><button class="btn alt hid" id="inst">Install app</button>
        </div>
      </div>
    </div>
    <div class="modal hid" id="lvm">
      <div class="panel">
        <h2>Choose a level</h2>
        <div id="lvs"></div>
        <button class="btn alt" id="back">Back</button>
      </div>
    </div>
    <div class="modal hid" id="psm">
      <div class="panel">
        <h2>Paused</h2>
        <div class="row">
          <button class="btn" id="rs">Resume</button
          ><button class="btn alt" id="mn">Menu</button>
        </div>
      </div>
    </div>
    <div class="modal hid" id="wnm">
      <div class="panel">
        <h2 id="wt">Level clear!</h2>
        <div class="stars" id="st"></div>
        <p id="ws"></p>
        <div class="row">
          <button class="btn" id="nx">Next level</button
          ><button class="btn alt" id="rp">Replay</button>
        </div>
      </div>
    </div>
    <div class="modal hid" id="ovm">
      <div class="panel">
        <h2>Out of lives</h2>
        <p id="os"></p>
        <div class="row">
          <button class="btn" id="rt">Try again</button
          ><button class="btn alt" id="mn2">Menu</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
